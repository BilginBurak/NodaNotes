[workspace]
members = [
    "crates/core",
    "crates/shared",
    "crates/tauri-shell",
    "crates/android-bridge"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
thiserror = "1.0"

[profile.release]
opt-level = "s"      # Size optimizations, keeping execution fast and reducing memory/cache footprints
lto = true           # Full Link-Time Optimization across all crates
codegen-units = 1    # Reduces parallel codegen units to maximize LLVM optimizations
panic = "unwind"     # Enables unwinding for compatibility with external crates
strip = true         # Strips all debug symbols from the final binary

