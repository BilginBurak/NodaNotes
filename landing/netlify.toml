[build]
  command = "bun run build"
  publish = "build"

[build.environment]
  BUN_VERSION = "1.3.14"

# Handle fallback routing for SPA redirects if needed
[[redirects]]
  from = "/api/update"
  to = "https://api.github.com/repos/BilginBurak/NodaNotes/releases/latest"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
